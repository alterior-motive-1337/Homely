name: Homely CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --check public/app.js
      - name: Install CI browser
        run: |
          npm install --no-save playwright@1.55.0
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: Start Homely and verify real state
        shell: bash
        run: |
          node dist/test/start-server.js > /tmp/homely.log 2>&1 &
          echo $! > /tmp/homely.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          node <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const get = async (path) => {
            const response = await fetch("http://127.0.0.1:4173" + path);
            assert(response.ok, path + " returned " + response.status);
            return response;
          };

          const health = await (await get("/api/health")).json();
          assert(health.ok === true, "health endpoint not ready");
          assert(health.database === "OK", "database readiness missing");
          assert(health.durability === "TURSO", "durability readiness missing");

          const overview = await (await get("/api/overview")).json();
          assert(overview.home.name === "14 Hawthorn Residence", "seed home missing");
          assert(overview.systems.length === 7, "expected 7 systems");
          assert(overview.summary.systems_needing_attention === 2, "expected two systems needing attention");
          assert(overview.summary.open_issues === 1, "expected one active issue");
          assert(overview.summary.overdue_maintenance === 1, "expected one overdue maintenance rule");

          const assets = await (await get("/api/assets")).json();
          assert(assets.length === 16, "expected 16 seeded assets");
          assert(assets.some((asset) => asset.name === "Irrigation controller" && asset.health === "UNKNOWN"), "unknown-health asset missing");

          const camera = await (await get("/api/assets/asset-camera-4")).json();
          assert(camera.issues.some((issue) => issue.status === "OPEN"), "Camera 4 issue missing");

          const tap = await (await get("/api/assets/asset-tap")).json();
          assert(tap.history.some((event) => event.title.includes("aerator cleaned")), "kitchen tap history missing");

          const integrations = await (await get("/api/integrations/status")).json();
          assert(integrations.ai.available === false, "CI must not call paid providers");
          assert(integrations.ai.provider === "groq", "Groq provider status missing");
          assert(!("googleDrive" in integrations), "removed Drive integration must not appear in runtime status");

          const households = await (await get("/api/homes")).json();
          assert(households.homes.length === 1 && households.homes[0].role === "OWNER", "CI owner membership missing");
          const members = await (await get("/api/homes/members")).json();
          assert(members.length === 1, "CI household should have one owner");
          const backup = await get("/api/account/export");
          assert(backup.headers.get("content-type") === "application/x-tar", "household archive export missing");
          const archive = Buffer.from(await backup.arrayBuffer());
          assert(archive.subarray(0,11).toString("ascii").startsWith("homely.json"), "backup manifest missing");

          const documents = await (await get("/api/documents")).json();
          assert(documents.length === 3, "expected three seeded documents");
          assert(documents.some((doc) => doc.title.includes("inverter warranty") && doc.asset_name === "8 kW inverter"), "document association missing");

          const projects = await (await get("/api/projects")).json();
          assert(projects.some((project) => project.title === "Battery storage expansion" && project.status === "PLANNED"), "seed project missing");

          const access = await (await get("/api/auth/status")).json();
          assert(access.enabled === false && access.authenticated === true, "POC must open without password access");
          const icon = await get("/favicon.svg");
          assert(icon.headers.get("content-type").includes("image/svg+xml"), "house favicon must use SVG content type");

          const warranty = await get("/demo-documents/inverter-warranty.txt");
          assert((await warranty.text()).includes("20 January 2030"), "warranty document did not resolve");

          const post = async (path, body) => {
            const response = await fetch("http://127.0.0.1:4173" + path, {
              method: "POST",
              headers: body ? { "content-type": "application/json" } : undefined,
              body: body ? JSON.stringify(body) : undefined
            });
            const data = await response.json();
            assert(response.ok, path + " failed: " + JSON.stringify(data));
            return data;
          };

          const issuesBefore = (await (await get("/api/issues")).json()).length;
          const proposal = await post("/api/transactions/preview", {
            actionType: "REPORT_ISSUE",
            reason: "CI verifies inert proposal and permanent issue commit.",
            payload: {
              assetId: "asset-tap",
              title: "CI transaction issue",
              severity: "MEDIUM",
              description: "Created only to verify Homely transaction semantics."
            }
          });
          assert(proposal.transaction.status === "PROPOSED", "proposal did not persist");
          assert((await (await get("/api/issues")).json()).length === issuesBefore, "preview mutated issue state");

          await post("/api/transactions/" + encodeURIComponent(proposal.transaction.id) + "/commit");
          assert((await (await get("/api/issues")).json()).some((issue) => issue.title === "CI transaction issue"), "commit did not create issue");

          const undoResponse = await fetch("http://127.0.0.1:4173/api/transactions/" + encodeURIComponent(proposal.transaction.id) + "/undo", { method: "POST" });
          assert(undoResponse.status === 409, "committed issue history must not be deletable");
          assert((await (await get("/api/issues")).json()).some((issue) => issue.title === "CI transaction issue"), "permanent issue disappeared after rejected undo");

          const audited = await (await get("/api/transactions/" + encodeURIComponent(proposal.transaction.id))).json();
          assert(audited.status === "COMMITTED", "permanent issue transaction should remain committed");
          NODE

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const browser = await chromium.launch({
            headless: true,
            ...(fs.existsSync("/usr/bin/google-chrome") ? { executablePath: "/usr/bin/google-chrome" } : {})
          });
          const page = await browser.newPage({ viewport: { width: 1366, height: 768 } });
          await page.addInitScript(() => {
            class FakeSpeechRecognition {
              constructor() { window.__recognition = this; }
              abort() { window.__voiceAborts = (window.__voiceAborts || 0) + 1; this.onend?.(); }
              start() {
                this.onstart?.();
                this.onresult?.({
                  resultIndex: 0,
                  results: [[{ transcript: "check the kitchen tap" }]]
                });
              }
            }
            Object.defineProperty(window, "SpeechRecognition", {
              configurable: true,
              value: FakeSpeechRecognition
            });
          });
          const errors = [];
          page.on("pageerror", (error) => errors.push(String(error)));
          page.on("console", (message) => {
            if (message.type() === "error") errors.push(message.text());
          });

          await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });
          await page.getByText("14 Hawthorn Residence").waitFor();
          await page.getByText("Home memory active").waitFor();
          await page.getByRole("button", { name: "Household settings" }).click();
          await page.locator("#modal").getByRole("heading", { name: "Household settings" }).waitFor();
          await page.getByRole("link", { name: "Export household" }).waitFor();
          await page.locator("#invite-home-form input[name=email]").fill("ci-invite@example.test");
          await page.locator("#invite-home-form select[name=role]").selectOption("VIEWER");
          await page.getByRole("button", { name: "Create invite link" }).click();
          await page.waitForTimeout(500);
          const inviteDebug = await page.evaluate(() => ({
            valid: document.querySelector("#invite-home-form")?.checkValidity(),
            email: document.querySelector('#invite-home-form input[name="email"]')?.value,
            toast: document.querySelector("#toast")?.textContent,
            created: !!document.querySelector("#invite-link")
          }));
          if (!inviteDebug.created) throw new Error("Invitation form failed: " + JSON.stringify(inviteDebug) + " | " + errors.join(" | "));
          await page.locator("#invite-link").waitFor();
          await page.getByRole("button", { name: "Delete account…" }).click();
          await page.locator("#delete-account-form").waitFor();
          await page.getByRole("button", { name: "Cancel" }).click();

          await page.getByRole("button", { name: "Voice", exact: true }).click();
          if ((await page.locator("#chat-input").inputValue()) !== "check the kitchen tap") {
            throw new Error("voice input did not populate chat");
          }
          await page.getByRole("button", { name: "Stop listening", exact: true }).click();
          if ((await page.evaluate(() => window.__voiceAborts)) !== 1) throw new Error("Stop listening must abort voice capture");

          const horizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 2);
          if (horizontalOverflow) throw new Error("desktop shell has horizontal overflow");

          await page.locator("#nav").getByRole("button", { name: "Appliances", exact: true }).click();
          if (!page.url().includes("view=appliances")) throw new Error("navigation did not update URL");
          await page.getByText("8 kW inverter", { exact: true }).waitFor();
          await page.getByText("8 kW inverter", { exact: true }).click();
          await page.getByText("Sunsynk 8 kW inverter warranty").waitFor();
          await page.locator("#modal-close").click();

          let issueFetches=0;
          page.on("request",request=>{
            if(request.method()==="GET" && new URL(request.url()).pathname==="/api/issues")issueFetches++;
          });
          await page.locator("#nav").getByRole("button", { name: "Issues", exact: true }).click();
          await page.getByText("Camera 4 intermittent disconnect").waitFor();
          const firstIssueFetches=issueFetches;
          await page.locator("#nav").getByRole("button", { name: "Appliances", exact: true }).click();
          await page.locator("#nav").getByRole("button", { name: "Issues", exact: true }).click();
          await page.getByText("Camera 4 intermittent disconnect").waitFor();
          if(issueFetches!==firstIssueFetches)throw new Error("Cached tab refetched issue records");
          await page.locator("#refresh-view").click();
          await page.getByText("Camera 4 intermittent disconnect").waitFor();
          if(issueFetches!==firstIssueFetches+1)throw new Error("Explicit refresh should reload issue records");
          await page.locator("[data-issue-open]").filter({ hasText: "Camera 4 intermittent disconnect" }).click();
          await page.locator("#modal").getByRole("heading", { name: "Files", exact: true }).waitFor();
          await page.locator("#modal-close").click();
          await page.getByRole("button", { name: "Report issue" }).click();
          await page.locator("#issue-form select[name=assetId]").selectOption("asset-tap");
          await page.locator("#issue-form input[name=title]").fill("Browser transaction issue");
          await page.locator("#issue-form textarea[name=description]").fill("Browser verifies preview and commit.");
          await page.getByRole("button", { name: "Preview" }).click();
          await page.getByText("Approval required").waitFor();
          await page.getByRole("button", { name: "Approve & commit" }).click();
          await page.getByText("Browser transaction issue").waitFor();

          await page.locator("#nav").getByRole("button", { name: "Repairs", exact: true }).click();
          await page.getByRole("button", { name: "Record repair" }).click();
          await page.locator("#repair-form select[name=assetId]").selectOption("asset-tap");
          await page.locator("#repair-form input[name=title]").fill("Browser repair record");
          await page.locator("#repair-form input[name=cost]").fill("250");
          await page.getByRole("button", { name: "Preview" }).click();
          await page.getByText("Approval required").waitFor();
          await page.getByRole("button", { name: "Approve & commit" }).click();
          await page.getByText("Browser repair record").waitFor();
          await page.locator("[data-repair-open]").filter({ hasText: "Browser repair record" }).click();
          await page.locator("#modal").getByRole("heading", { name: "Work performed", exact: true }).waitFor();
          await page.locator("#modal-close").click();

          await page.locator("#nav").getByRole("button", { name: "Files", exact: true }).click();
          await page.getByText("Sunsynk 8 kW inverter warranty").waitFor();
          await page.getByText("Sunsynk 8 kW inverter warranty").click();
          await page.locator("#viewer").waitFor({ state: "visible" });
          await page.locator("#viewer-close").click();

          await page.getByText("Chat unavailable").waitFor();
          if (!(await page.locator('#chat-form button[type="submit"]').isDisabled())) throw new Error("chat should be disabled when AI is unavailable");

          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator("#nav").getByRole("button", { name: "Home", exact: true }).click();
          await page.getByText("14 Hawthorn Residence").waitFor();
          await page.getByRole("button", { name: "Ask Homely", exact: true }).click();
          await page.locator("#chat-rail").waitFor({ state: "visible" });

          const mobileOverflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 2);
          if (mobileOverflow) throw new Error("mobile shell has horizontal overflow");
          if (errors.length) throw new Error("Browser errors: " + errors.join(" | "));
          await browser.close();

          NODE

          kill "$(cat /tmp/homely.pid)"
      - if: failure()
        run: cat /tmp/homely.log || true

