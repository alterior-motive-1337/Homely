name: Homely CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: node --check public/app.js
      - name: Install CI browser
        run: |
          npm install --no-save playwright@1.55.0
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - run: npm run db:reset
      - name: Start Homely and verify real state
        shell: bash
        run: |
          node dist/src/server.js > /tmp/homely.log 2>&1 &
          echo $! > /tmp/homely.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          node <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const get = async (path) => {
            const response = await fetch("http://127.0.0.1:4173" + path);
            assert(response.ok, path + " returned " + response.status);
            return response;
          };

          const health = await (await get("/api/health")).json();
          assert(health.ok === true, "health endpoint not ready");

          const overview = await (await get("/api/overview")).json();
          assert(overview.home.name === "14 Hawthorn Residence", "seed home missing");
          assert(overview.systems.length === 7, "expected 7 systems");
          assert(overview.summary.systems_needing_attention === 2, "expected two systems needing attention");
          assert(overview.summary.open_issues === 1, "expected one active issue");
          assert(overview.summary.overdue_maintenance === 1, "expected one overdue maintenance rule");

          const assets = await (await get("/api/assets")).json();
          assert(assets.length === 16, "expected 16 seeded assets");
          assert(assets.some((asset) => asset.name === "Irrigation controller" && asset.health === "UNKNOWN"), "unknown-health asset missing");

          const camera = await (await get("/api/assets/asset-camera-4")).json();
          assert(camera.issues.some((issue) => issue.status === "OPEN"), "Camera 4 issue missing");

          const tap = await (await get("/api/assets/asset-tap")).json();
          assert(tap.history.some((event) => event.title.includes("aerator cleaned")), "kitchen tap history missing");

          const warranty = await get("/demo-documents/inverter-warranty.txt");
          assert((await warranty.text()).includes("20 January 2030"), "warranty document did not resolve");

          const post = async (path, body) => {
            const response = await fetch("http://127.0.0.1:4173" + path, {
              method: "POST",
              headers: body ? { "content-type": "application/json" } : undefined,
              body: body ? JSON.stringify(body) : undefined
            });
            const data = await response.json();
            assert(response.ok, path + " failed: " + JSON.stringify(data));
            return data;
          };

          const issuesBefore = (await (await get("/api/issues")).json()).length;
          const proposal = await post("/api/transactions/preview", {
            actionType: "REPORT_ISSUE",
            reason: "CI verifies inert proposal and reversible commit.",
            payload: {
              assetId: "asset-tap",
              title: "CI transaction issue",
              severity: "MEDIUM",
              description: "Created only to verify Homely transaction semantics."
            }
          });
          assert(proposal.transaction.status === "PROPOSED", "proposal did not persist");
          assert((await (await get("/api/issues")).json()).length === issuesBefore, "preview mutated issue state");

          await post("/api/transactions/" + encodeURIComponent(proposal.transaction.id) + "/commit");
          assert((await (await get("/api/issues")).json()).some((issue) => issue.title === "CI transaction issue"), "commit did not create issue");
          await post("/api/transactions/" + encodeURIComponent(proposal.transaction.id) + "/undo");
          assert(!(await (await get("/api/issues")).json()).some((issue) => issue.title === "CI transaction issue"), "undo did not remove created issue");

          const audited = await (await get("/api/transactions/" + encodeURIComponent(proposal.transaction.id))).json();
          assert(audited.status === "REVERSED", "original transaction was not retained as reversed");
          NODE

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const browser = await chromium.launch({
            headless: true,
            ...(fs.existsSync("/usr/bin/google-chrome") ? { executablePath: "/usr/bin/google-chrome" } : {})
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          page.on("pageerror", (error) => errors.push(String(error)));
          page.on("console", (message) => {
            if (message.type() === "error") errors.push(message.text());
          });

          await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });
          await page.getByText("14 Hawthorn Residence").waitFor();
          await page.getByRole("button", { name: "Assets" }).click();
          await page.getByText("8 kW inverter", { exact: true }).waitFor();
          await page.getByText("8 kW inverter", { exact: true }).click();
          await page.getByText("Sunsynk 8 kW inverter warranty").waitFor();
          await page.getByRole("button", { name: "Close asset details" }).click();

          await page.getByRole("button", { name: "Issues" }).click();
          await page.getByText("Camera 4 intermittent disconnect").waitFor();

          await page.getByRole("button", { name: "Report issue" }).click();
          await page.locator("#issue-form select[name=assetId]").selectOption("asset-tap");
          await page.locator("#issue-form input[name=title]").fill("Browser transaction issue");
          await page.locator("#issue-form textarea[name=description]").fill("Browser verifies preview, commit and undo.");
          await page.getByRole("button", { name: "Preview" }).click();
          await page.getByText("PROPOSED TRANSACTION").waitFor();
          await page.getByRole("button", { name: "Approve & commit" }).click();
          await page.getByText("Browser transaction issue").waitFor();

          await page.getByRole("button", { name: "Transactions" }).click();
          const transactionRow = page.locator(".transaction-row").filter({ hasText: 'Homeowner reported "Browser transaction issue"' });
          await transactionRow.waitFor();
          await transactionRow.getByRole("button", { name: "Undo" }).click();
          await page.getByRole("button", { name: "Undo transaction" }).click();
          await page.getByText("Transaction reversed. Audit history retained.").waitFor();

          await page.getByRole("button", { name: "Issues" }).click();
          if (await page.getByText("Browser transaction issue").count()) {
            throw new Error("browser undo did not reverse issue state");
          }

          await page.getByRole("button", { name: "Maintenance" }).click();
          await page.getByText("Inspect and clear north gutters").waitFor();

          await page.setViewportSize({ width: 390, height: 844 });
          await page.getByRole("button", { name: "Timeline" }).click();
          await page.getByText("Kitchen tap aerator cleaned").waitFor();

          if (errors.length) throw new Error("Browser errors: " + errors.join(" | "));
          await browser.close();
          NODE

          kill "$(cat /tmp/homely.pid)"
      - if: failure()
        run: cat /tmp/homely.log || true
