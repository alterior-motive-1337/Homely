name: Homely CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --check public/app.js
      - name: Install CI browser
        run: |
          npm install --no-save playwright@1.55.0
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: Start Homely and verify real state
        shell: bash
        run: |
          node dist/test/start-server.js > /tmp/homely.log 2>&1 &
          echo $! > /tmp/homely.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          node <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const get = async (path) => {
            const response = await fetch("http://127.0.0.1:4173" + path);
            assert(response.ok, path + " returned " + response.status);
            return response;
          };

          const health = await (await get("/api/health")).json();
          assert(health.ok === true, "health endpoint not ready");
          assert(health.database === "OK", "database readiness missing");
          assert(health.durability === "TURSO", "durability readiness missing");

          const overview = await (await get("/api/overview")).json();
          assert(overview.home.name === "14 Hawthorn Residence", "seed home missing");
          assert(overview.systems.length === 7, "expected 7 systems");
          assert(overview.summary.systems_needing_attention === 2, "expected two systems needing attention");
          assert(overview.summary.open_issues === 1, "expected one active issue");
          assert(overview.summary.overdue_maintenance === 1, "expected one overdue maintenance rule");

          const assets = await (await get("/api/assets")).json();
          assert(assets.length === 16, "expected 16 seeded assets");
          assert(assets.some((asset) => asset.name === "Irrigation controller" && asset.health === "UNKNOWN"), "unknown-health asset missing");

          const camera = await (await get("/api/assets/asset-camera-4")).json();
          assert(camera.issues.some((issue) => issue.status === "OPEN"), "Camera 4 issue missing");

          const tap = await (await get("/api/assets/asset-tap")).json();
          assert(tap.history.some((event) => event.title.includes("aerator cleaned")), "kitchen tap history missing");

          const integrations = await (await get("/api/integrations/status")).json();
          assert(integrations.ai.available === false, "CI must not call paid providers");
          assert(integrations.ai.provider === "groq", "Groq provider status missing");
          assert(!("googleDrive" in integrations), "removed Drive integration must not appear in runtime status");

          const households = await (await get("/api/homes")).json();
          assert(households.homes.length === 1 && households.homes[0].role === "OWNER", "CI owner membership missing");
          const members = await (await get("/api/homes/members")).json();
          assert(members.length === 1, "CI household should have one owner");
          const backup = await get("/api/account/export");
          assert(backup.headers.get("content-type") === "application/x-tar", "household archive export missing");
          const archive = Buffer.from(await backup.arrayBuffer());
          assert(archive.subarray(0,11).toString("ascii").startsWith("homely.json"), "backup manifest missing");

          const documents = await (await get("/api/documents")).json();
          assert(documents.length === 3, "expected three seeded documents");
          assert(documents.some((doc) => doc.title.includes("inverter warranty") && doc.asset_name === "8 kW inverter"), "document association missing");

          const projects = await (await get("/api/projects")).json();
          assert(projects.some((project) => project.title === "Battery storage expansion" && project.status === "PLANNED"), "seed project missing");

          const access = await (await get("/api/auth/status")).json();
          assert(access.enabled === false && access.authenticated === true, "POC must open without password access");
          const icon = await get("/favicon.svg");
          assert(icon.headers.get("content-type").includes("image/svg+xml"), "house favicon must use SVG content type");

          const warranty = await get("/demo-documents/inverter-warranty.txt");
          assert((await warranty.text()).includes("20 January 2030"), "warranty document did not resolve");

          const post = async (path, body) => {
            const response = await fetch("http://127.0.0.1:4173" + path, {
              method: "POST",
              headers: body ? { "content-type": "application/json" } : undefined,
              body: body ? JSON.stringify(body) : undefined
            });
            const data = await response.json();
            assert(response.ok, path + " failed: " + JSON.stringify(data));
            return data;
          };

          const issuesBefore = (await (await get("/api/issues")).json()).length;
          const proposal = await post("/api/transactions/preview", {
            actionType: "REPORT_ISSUE",
            reason: "CI verifies inert proposal and permanent issue commit.",
            payload: {
              assetId: "asset-tap",
              title: "CI transaction issue",
              severity: "MEDIUM",
              description: "Created only to verify Homely transaction semantics."
            }
          });
          assert(proposal.transaction.status === "PROPOSED", "proposal did not persist");
          assert((await (await get("/api/issues")).json()).length === issuesBefore, "preview mutated issue state");

          await post("/api/transactions/" + encodeURIComponent(proposal.transaction.id) + "/commit");
          assert((await (await get("/api/issues")).json()).some((issue) => issue.title === "CI transaction issue"), "commit did not create issue");

          const undoResponse = await fetch("http://127.0.0.1:4173/api/transactions/" + encodeURIComponent(proposal.transaction.id) + "/undo", { method: "POST" });
          assert(undoResponse.status === 409, "committed issue history must not be deletable");
          assert((await (await get("/api/issues")).json()).some((issue) => issue.title === "CI transaction issue"), "permanent issue disappeared after rejected undo");

          const audited = await (await get("/api/transactions/" + encodeURIComponent(proposal.transaction.id))).json();
          assert(audited.status === "COMMITTED", "permanent issue transaction should remain committed");
          NODE

          node test/browser-workspace.mjs

          kill "$(cat /tmp/homely.pid)"
      - if: failure()
        run: cat /tmp/homely.log || true

