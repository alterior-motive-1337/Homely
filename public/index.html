<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Homely</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/sketch.css">
</head>
<body>
<section class="auth-screen" id="auth-screen" hidden>
  <div class="auth-card">
    <img src="/house.svg" alt="" width="48" height="48">
    <p class="eyebrow">Homely</p>
    <h1>Sign in</h1>
    <p id="auth-message"></p>
    <a class="primary-button auth-google" id="google-signin" href="/auth/google">Continue with Google</a>
  </div>
</section>
<div class="app-shell" id="app-shell" hidden>
  <aside class="sidebar">
    <nav id="nav" class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="home" aria-label="Home" title="Home"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="nav-label">Home</span></button>
      <button class="nav-item" data-view="issues" aria-label="Issues" title="Issues"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17.5h.01"/></svg><span class="nav-label">Issues</span></button>
      <button class="nav-item" data-view="repairs" aria-label="Repairs" title="Repairs"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 7.5 2-2a4 4 0 0 0-5.5 5.5l-7.5 7.5a2 2 0 0 0 2.8 2.8l7.5-7.5a4 4 0 0 0 5.5-5.5l-2 2-3-3z"/></svg><span class="nav-label">Repairs</span></button>
      <button class="nav-item" data-view="appliances" aria-label="Appliances" title="Appliances"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M8 6h.01M11 6h.01"/><circle cx="12" cy="15" r="3"/></svg><span class="nav-label">Appliances</span></button>
      <button class="nav-item" data-view="files" aria-label="Files" title="Files"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h5M8.5 13h7M8.5 17h7"/></svg><span class="nav-label">Files</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="account-menu"><span id="account-email" class="account-email" title="Signed-in account"></span><button id="household-settings" type="button" class="button" aria-label="Settings" title="Settings"><svg class="account-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a2 2 0 0 1 2 2l1.8.8 1.8-.5 1.8 3.1-1.3 1.3v2l1.3 1.3-1.8 3.1-1.8-.5-1.8.8a2 2 0 0 1-4 0l-1.8-.8-1.8.5-1.8-3.1 1.3-1.3v-2L4.6 8.9l1.8-3.1 1.8.5 1.8-.8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="11.5" r="2.5"/></svg></button><button id="sign-out" type="button" class="button" aria-label="Sign out" title="Sign out"><svg class="account-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M15 7l5 5-5 5M8 12h12"/></svg></button></div>
      <button class="button" id="alerts-trigger" type="button" hidden>Alerts</button>
      <button class="button chat-trigger" id="chat-trigger" type="button" aria-expanded="false" aria-controls="chat-rail">Ask Homely</button>
    </div>
  </aside>
  <main class="workspace" id="workspace">
    <header class="topbar"><h1 id="page-title">Home</h1></header>
    <section id="content" class="content"></section>
  </main>
  <aside class="chat-rail" id="chat-rail" aria-hidden="true" aria-label="Homely assistant">
    <div class="panel-resizer" id="assistant-resizer" role="separator" tabindex="0" aria-label="Resize assistant" aria-orientation="vertical" aria-controls="workspace chat-rail" title="Drag or use arrow keys to resize. Double-click to reset."></div>
    <div class="chat-head">
      <strong id="chat-current-title" class="chat-current-title">New chat</strong>
      <div class="chat-toolbar">
        <button class="icon-button" id="chat-conversations-toggle" type="button" aria-label="Previous chats" title="Previous chats" aria-expanded="false" aria-controls="chat-history-panel"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2-5.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
        <button class="icon-button" id="chat-new" type="button" aria-label="New chat" title="New chat"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-button" id="assistant-expand" type="button" aria-label="Expand chat" title="Expand chat" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button class="icon-button" id="assistant-collapse" type="button" aria-label="Collapse chat" title="Collapse chat"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="icon-button" id="chat-close" type="button" aria-label="Close chat" title="Close chat"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div class="chat-history-panel" id="chat-history-panel" hidden><div id="chat-history-list" class="chat-history-list"></div></div>
    <div class="chat-body" id="chat-body"></div>
    <form class="chat-form" id="chat-form"><textarea id="chat-input" aria-label="Message Homely" maxlength="4000" rows="3" placeholder="Ask Homely…" aria-keyshortcuts="Enter Shift+Enter" required></textarea><div class="chat-actions">
      <button class="icon-button voice-button" id="voice-button" type="button" aria-label="Dictate message" title="Dictate message" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button>
      <button class="primary-button chat-send" type="submit" aria-label="Send message" title="Send message"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14 0M13 6l6 6-6 6"/></svg></button>
    </div></form>
  </aside>
</div>
<button class="chat-backdrop" id="chat-backdrop" type="button" aria-label="Close assistant" hidden></button>
<button class="chat-fab" id="chat-open" type="button" aria-expanded="false" aria-controls="chat-rail">Ask Homely</button>
<dialog class="modal" id="modal" aria-label="Home record"><button class="modal-close" id="modal-close" aria-label="Close record"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="modal-body"></div></dialog>
<dialog class="viewer" id="viewer" aria-labelledby="viewer-title"><header class="viewer-head"><div><strong id="viewer-title">File</strong></div><div class="viewer-controls"><button class="button" id="analyze-file" type="button" hidden>Analyze</button><button class="icon-button" id="viewer-close" aria-label="Close file"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header><div class="viewer-body" id="viewer-body"></div><div id="viewer-insight" class="viewer-insight" hidden></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
