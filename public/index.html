<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Homely</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Homely home"><img class="brand-mark" src="/house.svg" width="32" height="32" alt=""><span><strong>Homely</strong><small>Home memory</small></span></a>
    <nav id="nav" class="nav">
      <button class="nav-item active" data-view="home">Home</button>
      <button class="nav-item" data-view="issues">Issues</button>
      <button class="nav-item" data-view="repairs">Repairs</button>
      <button class="nav-item" data-view="appliances">Appliances</button>
      <button class="nav-item" data-view="files">Files</button>
    </nav>
    <div class="sidebar-footer">
      <div class="runtime-status" id="runtime-status"><span class="dot"></span><span id="runtime-text">Checking state…</span></div>
    </div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><h1 id="page-title">Home</h1></div><div id="today"></div></header>
    <section id="content" class="content"></section>
  </main>
  <aside class="chat-rail" id="chat-rail">
    <header class="chat-head"><div><strong>Ask Homely</strong><small id="agent-state">Home-aware assistant</small></div><button class="icon-button mobile-only" id="chat-close" aria-label="Close chat">×</button></header>
    <div class="chat-body" id="chat-body"><div class="chat-empty">What needs attention?</div></div>
    <form class="chat-form" id="chat-form"><textarea id="chat-input" maxlength="4000" rows="3" placeholder="Ask Homely…" required></textarea><div class="chat-actions"><button class="button voice-button" id="voice-button" type="button">Voice</button><button class="primary-button" type="submit">Send</button></div></form>
  </aside>
</div>
<button class="chat-fab mobile-only" id="chat-open">Ask Homely</button>
<dialog class="modal" id="modal" aria-label="Home record"><button class="modal-close" id="modal-close" aria-label="Close record">×</button><div id="modal-body"></div></dialog>
<dialog class="viewer" id="viewer" aria-labelledby="viewer-title"><header class="viewer-head"><div><p class="eyebrow">File viewer</p><strong id="viewer-title">File</strong></div><button class="icon-button" id="viewer-close" aria-label="Close file">×</button></header><div class="viewer-body" id="viewer-body"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
