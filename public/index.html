<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Homely</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/sketch.css">
</head>
<body>
<section class="auth-screen" id="auth-screen" hidden>
  <div class="auth-card">
    <img src="/house.svg" alt="" width="48" height="48">
    <p class="eyebrow">Homely</p>
    <h1>Sign in</h1>
    <p id="auth-message"></p>
    <a class="primary-button auth-google" id="google-signin" href="/auth/google">Continue with Google</a>
  </div>
</section>
<div class="app-shell" id="app-shell" hidden>
  <aside class="sidebar">
    <nav id="nav" class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="home" aria-label="Home" title="Home"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-7h6v7"/></svg></button>
      <button class="nav-item" data-view="issues" aria-label="Issues" title="Issues"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7 18h10"/><path d="M12 22a2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M7 7h10"/></svg></button>
      <button class="nav-item" data-view="repairs" aria-label="Repairs" title="Repairs"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6h10l1 13H6L7 6Z"/><path d="M9 6V4.5A3 3 0 0 1 12 2a3 3 0 0 1 3 2.5V6M9 11h6M9 15h6"/></svg></button>
      <button class="nav-item" data-view="appliances" aria-label="Appliances" title="Appliances"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v13"/><path d="M7 10h10M8 16h8"/><path d="M9 4V2m6 2V2"/></svg></button>
      <button class="nav-item" data-view="files" aria-label="Files" title="Files"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-5-5Z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg></button>
    </nav>
    <div class="sidebar-footer">
      <div class="account-menu">
        <span id="account-email" class="account-email" title="Signed-in account"></span>
        <button id="household-settings" type="button" class="button" aria-label="Settings" title="Settings">Household</button>
        <button id="sign-out" type="button" class="button" aria-label="Sign out" title="Sign out">Sign out</button>
      </div>
      <button class="icon-button status-button" id="alerts-trigger" type="button" aria-label="Alerts" title="Alerts" hidden><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 1 5 5v4l2 4H5l2-4V8a5 5 0 0 1 5-5Z"/><path d="M10 18a2 2 0 0 0 4 0"/><span id="alerts-count" class="count-badge" aria-hidden="true">0</span></svg></button>
      <button class="icon-button chat-trigger" id="chat-trigger" type="button" aria-label="Ask Homely" title="Ask Homely" aria-expanded="false" aria-controls="chat-rail"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5 4 20V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H7Z"/><path d="M8 9h8M8 13h6"/></svg></button>
    </div>
  </aside>
  <main class="workspace" id="workspace">
    <header class="topbar"><h1 id="page-title">Home</h1></header>
    <section id="content" class="content"></section>
  </main>
  <aside class="chat-rail" id="chat-rail" aria-hidden="true" aria-label="Homely assistant">
    <div class="panel-resizer" id="assistant-resizer" role="separator" tabindex="0" aria-label="Resize assistant" aria-orientation="vertical" aria-controls="workspace chat-rail" title="Drag or use arrow keys to resize"></div>
    <div class="chat-head">
      <button id="chat-current-title" class="chat-current-title" type="button" title="Rename chat" aria-label="Rename chat" disabled>New chat</button>
      <div class="chat-toolbar">
        <button class="icon-button" id="chat-conversations-toggle" type="button" aria-label="Previous chats" title="Previous chats" aria-expanded="false" aria-controls="chat-history-panel"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19H8l-4 2v-2.5A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="M8 9h8M8 13h6"/></svg></button>
        <button class="icon-button" id="chat-new" type="button" aria-label="New chat" title="New chat"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-button" id="assistant-expand" type="button" aria-label="Expand chat" title="Expand chat" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v18H8Z"/><path d="M12 7v10M9 10h6M9 14h6"/></svg></button>
        <button class="icon-button" id="assistant-collapse" type="button" aria-label="Collapse chat" title="Collapse chat"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v14H5z"/><path d="M9 8l6 4-6 4V8Z"/></svg></button>
        <button class="icon-button" id="chat-close" type="button" aria-label="Close chat" title="Close chat"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div class="chat-history-panel" id="chat-history-panel" hidden><div id="chat-history-list" class="chat-history-list"></div></div>
    <div class="chat-body" id="chat-body"></div>
    <form class="chat-form" id="chat-form"><textarea id="chat-input" aria-label="Message Homely" maxlength="4000" rows="3" placeholder="Ask Homely…" aria-keyshortcuts="Enter Shift+Enter" required></textarea>
      <div class="chat-actions">
        <button class="icon-button voice-button" id="voice-button" type="button" aria-label="Dictate message" title="Dictate message" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 1 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v5"/></svg></button>
        <button class="primary-button chat-send" type="submit" aria-label="Send message" title="Send message"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5 20 4l-4.5 16-3.5-6.5L3 12.5Z"/></svg></button>
      </div>
    </form>
  </aside>
</div>
<button class="chat-backdrop" id="chat-backdrop" type="button" aria-label="Close assistant" hidden></button>
<button class="chat-fab icon-button" id="chat-open" type="button" aria-label="Open chat" title="Open chat" aria-expanded="false" aria-controls="chat-rail"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5 4 20V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H7Z"/><path d="M8 9h8M8 13h6"/></svg></button>
<dialog class="modal" id="modal" aria-label="Home record"><button class="modal-close" id="modal-close" aria-label="Close record"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="modal-body"></div></dialog>
<dialog class="viewer" id="viewer" aria-labelledby="viewer-title"><header class="viewer-head"><div><strong id="viewer-title">File</strong></div><div class="viewer-controls"><button class="button" id="analyze-file" type="button" hidden>Analyze</button><button class="icon-button" id="viewer-close" type="button" aria-label="Close file"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header><div class="viewer-body" id="viewer-body"></div><div class="viewer-insight" id="viewer-insight" hidden></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
