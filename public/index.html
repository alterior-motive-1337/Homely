<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Homely</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark">H</span><div><strong>Homely</strong><small>Property OS</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="assets">Assets</button>
        <button class="nav-item" data-view="work">Work</button>
        <button class="nav-item" data-view="history">History</button>
        <button class="nav-item" data-view="agent">Agent</button>
      </nav>
      <div class="sidebar-foot">
        <div class="runtime-status" id="runtime-status" data-tone="neutral">
          <span class="status-dot"></span><span id="runtime-status-text">Checking cloud state…</span>
        </div>
        <button class="logout-button" id="logout-button" type="button">Log out</button>
      </div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div><p class="eyebrow">HOME / OPERATING MEMORY</p><h1 id="page-title">Overview</h1></div>
        <div class="date" id="today"></div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="asset-dialog" class="asset-dialog">
    <button class="dialog-close" id="dialog-close" aria-label="Close asset details">×</button>
    <div id="asset-detail"></div>
  </dialog>
  <dialog id="action-dialog" class="action-dialog">
    <button class="dialog-close" id="action-dialog-close" aria-label="Close action">×</button>
    <div id="action-detail"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
